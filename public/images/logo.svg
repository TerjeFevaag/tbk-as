<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" role="img" aria-label="Teknisk Byggkontroll">
  <defs>
    <linearGradient id="swirlGradient" x1="4" y1="4" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef7c2f" />
      <stop offset="1" stop-color="#e98a2f" />
    </linearGradient>
    <linearGradient id="swirlGradientTail" x1="14" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e98a2f" />
      <stop offset="1" stop-color="#ef7c2f" />
    </linearGradient>
  </defs>

  <!-- Swirl mark: an open ring with a curling tail, evoking a coil/eddy -->
  <g transform="translate(2,2)">
    <path
      d="M36.55 34.22 A19 19 0 1 1 36.55 9.78 L28.89 16.21 A9 9 0 1 0 28.89 27.79 Z"
      fill="url(#swirlGradient)"
    />
    <path
      d="M28.89 27.79 C25.6 30.6 19.6 30.9 16.8 26.6 C14.7 23.3 15.9 19.3 19.4 18.1 C21.7 17.3 24 18.3 24.7 20.4 C25.2 22 24.3 23.5 22.7 23.8 C21.6 24 20.7 23.4 20.5 22.5"
      fill="none"
      stroke="url(#swirlGradientTail)"
      stroke-width="2.4"
      stroke-linecap="round"
    />
  </g>

  <!-- Wordmark: small-caps "TEKNISK BYGGKONTROLL" -->
  <text
    x="56"
    y="32"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    fill="#4b5766"
    letter-spacing="0.5"
  >
    <tspan font-size="24">T</tspan><tspan font-size="17">EKNISK </tspan><tspan font-size="24">B</tspan><tspan font-size="17">YGGKONTROLL</tspan>
  </text>
</svg>
